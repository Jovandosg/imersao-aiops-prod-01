# Template — arquivo único. Substitua os <placeholders> pelos valores da descoberta
# (Dockerfile/compose do projeto). Remova o bloco do banco se a app não tiver um.
apiVersion: v1
kind: Namespace
metadata:
  name: <ns>
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: <ns>
type: Opaque
stringData:
  POSTGRES_DB: <db_name>
  POSTGRES_USER: <db_user>
  POSTGRES_PASSWORD: "<db_password>"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: <ns>
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: <ns>
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-secret
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: <app>-config
  namespace: <ns>
data:
  # nomes EXATOS das variáveis lidas no código
  <VAR_HOST>: postgres
  <VAR_PORT>: "5432"
  <VAR_DATABASE>: <db_name>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: <app>
  namespace: <ns>
spec:
  replicas: 2
  selector:
    matchLabels:
      app: <app>
  template:
    metadata:
      labels:
        app: <app>
    spec:
      initContainers:
        - name: wait-postgres
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432; do echo aguardando postgres; sleep 2; done"]
      containers:
        - name: <app>
          image: <app>:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: <porta_app>
          envFrom:
            - configMapRef:
                name: <app>-config
          env:
            - name: <VAR_USER>
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: <VAR_PASSWORD>
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: <ready_path>
              port: <porta_app>
            periodSeconds: 5
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: <health_path>
              port: <porta_app>
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: <app>
  namespace: <ns>
spec:
  type: NodePort
  selector:
    app: <app>
  ports:
    - port: 80
      targetPort: <porta_app>
      nodePort: 30000
