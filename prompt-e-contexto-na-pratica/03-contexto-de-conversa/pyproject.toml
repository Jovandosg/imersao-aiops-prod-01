[project]
name = "contexto-de-conversa"
version = "0.1.0"
description = "Exemplo didatico: o historico da conversa como contexto — um array que o seu codigo reenvia"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.16",
    "langchain-anthropic>=1.6.1",
    "python-dotenv>=1.2.3",
    "streamlit>=1.62.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
