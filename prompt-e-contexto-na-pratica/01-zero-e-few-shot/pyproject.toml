[project]
name = "zero-e-few-shot"
version = "0.1.0"
description = "Exemplo didatico: zero-shot e few-shot lado a lado — o que dois exemplos no prompt mudam"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.16",
    "langchain-anthropic>=1.6.1",
    "python-dotenv>=1.2.3",
    "streamlit>=1.62.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
